<!DOCTYPE html>
<html>
<head>
    <title>Attendance Calculator</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
            background-color: #f2f2f2;
        }
        form {
            background: white;
            padding: 20px;
            display: inline-block;
            border-radius: 10px;
        }
        input, button {
            padding: 10px;
            margin: 10px;
        }
        button {
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>📊 Student Attendance Calculator</h2>

    <form method="POST">
        <input type="text" name="name" placeholder="Enter Student Name" required><br>
        <input type="text" name="attendance" placeholder="Enter Attendance (1,0,1,...)" required><br>
        <button type="submit">Calculate</button>
    </form>

    {% if result %}
        <h3>Result:</h3>
        <p><b>Name:</b> {{ result[0] }}</p>
        <p><b>Percentage:</b> {{ result[1] }}%</p>
        <p><b>Category:</b> {{ result[2] }}</p>
    {% endif %}

</body>
</html>
